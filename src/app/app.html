<mat-drawer-container class="example-container">
  <mat-drawer class="nav-item-container" mode="side" opened>
    <ng-container>
      <mat-list>
        @if(isLoggedIn$ | async) {
          <ng-container *ngFor="let menuItem of menuItemLabels;">
            <mat-list-item class="menu-item">
              <mat-icon>{{menuItem.icon}}</mat-icon>
              <span class="menu-item-label">{{menuItem.label}}</span>
            </mat-list-item>
          </ng-container>
          <mat-list-item class="menu-item logout-label">
            <button matButton="filled" (click)="logout()">
              <mat-icon>power_settings_new</mat-icon>
              <span>Log Out</span>
            </button>
          </mat-list-item>
        }
      </mat-list>
    </ng-container>
  </mat-drawer>
  <mat-drawer-content>
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
